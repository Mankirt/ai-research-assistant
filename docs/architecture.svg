<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>AI Research Assistant Architecture</title>
  <desc>Architecture diagram showing the flow from browser through API Gateway, Step Functions, four AI agents, DynamoDB cache, and back to the browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Georgia, serif; }
      .th { font-size: 14px; font-weight: 600; }
      .ts { font-size: 12px; font-weight: 400; fill: #5c5648; }
      .arr { stroke: #888; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .box-gray   { fill: #F1EFE8; stroke: #5F5E5A;  stroke-width: 0.5; }
      .box-purple { fill: #EEEDFE; stroke: #534AB7;  stroke-width: 0.5; }
      .box-teal   { fill: #E1F5EE; stroke: #0F6E56;  stroke-width: 0.5; }
      .box-blue   { fill: #E6F1FB; stroke: #185FA5;  stroke-width: 0.5; }
      .box-amber  { fill: #FAEEDA; stroke: #854F0B;  stroke-width: 0.5; }
      .th-purple  { fill: #3C3489; }
      .th-teal    { fill: #085041; }
      .th-blue    { fill: #0C447C; }
      .th-amber   { fill: #633806; }
      .th-gray    { fill: #444441; }
      .ts-purple  { fill: #534AB7; }
      .ts-blue    { fill: #185FA5; }
      .ts-amber   { fill: #854F0B; }
    </style>
  </defs>

  <!-- Browser -->
  <rect x="260" y="20" width="160" height="44" rx="8" class="box-gray"/>
  <text class="th th-gray" x="340" y="42" text-anchor="middle" dominant-baseline="central">Browser</text>

  <!-- Browser → API Gateway -->
  <line x1="340" y1="64" x2="340" y2="98" class="arr"/>
  <text class="ts" x="352" y="84" dominant-baseline="central">POST /start</text>

  <!-- API Gateway -->
  <rect x="230" y="100" width="220" height="44" rx="8" class="box-purple"/>
  <text class="th th-purple" x="340" y="122" text-anchor="middle" dominant-baseline="central">API Gateway</text>

  <!-- API Gateway → Start Pipeline Lambda -->
  <line x1="340" y1="144" x2="340" y2="178" class="arr"/>

  <!-- Start Pipeline Lambda -->
  <rect x="210" y="180" width="260" height="44" rx="8" class="box-purple"/>
  <text class="th th-purple" x="340" y="197" text-anchor="middle" dominant-baseline="central">Start pipeline Lambda</text>
  <text class="ts ts-purple" x="340" y="213" text-anchor="middle" dominant-baseline="central">returns execution_arn instantly</text>

  <!-- Start Pipeline Lambda → Step Functions -->
  <line x1="340" y1="224" x2="340" y2="258" class="arr"/>

  <!-- Step Functions container (ends at y=500) -->
  <rect x="40" y="260" width="600" height="220" rx="12" class="box-teal"/>
  <text class="th th-teal" x="340" y="282" text-anchor="middle" dominant-baseline="central">AWS Step Functions — research pipeline</text>

  <!-- Cache Check -->
  <rect x="60" y="296" width="140" height="44" rx="8" class="box-amber"/>
  <text class="th th-amber" x="130" y="314" text-anchor="middle" dominant-baseline="central">Cache check</text>
  <text class="ts ts-amber" x="130" y="330" text-anchor="middle" dominant-baseline="central">hit → skip pipeline</text>

  <!-- miss arrow: Cache Check → Researcher -->
  <line x1="200" y1="318" x2="228" y2="318" class="arr"/>
  <text class="ts" x="214" y="312" text-anchor="middle">miss</text>

  <!-- Researcher -->
  <rect x="230" y="296" width="120" height="44" rx="8" class="box-blue"/>
  <text class="th th-blue" x="290" y="314" text-anchor="middle" dominant-baseline="central">Researcher</text>
  <text class="ts ts-blue" x="290" y="330" text-anchor="middle" dominant-baseline="central">Tavily + Bedrock</text>

  <!-- Researcher → Fact Checker -->
  <line x1="350" y1="318" x2="362" y2="318" class="arr"/>

  <!-- Fact Checker -->
  <rect x="364" y="296" width="120" height="44" rx="8" class="box-blue"/>
  <text class="th th-blue" x="424" y="314" text-anchor="middle" dominant-baseline="central">Fact checker</text>
  <text class="ts ts-blue" x="424" y="330" text-anchor="middle" dominant-baseline="central">Bedrock</text>

  <!-- Fact Checker → Writer (L-bend down then left) -->
  <path d="M424 340 L424 368 L290 368 L290 386" fill="none" class="arr"/>

  <!-- Writer -->
  <rect x="230" y="388" width="120" height="44" rx="8" class="box-blue"/>
  <text class="th th-blue" x="290" y="406" text-anchor="middle" dominant-baseline="central">Writer</text>
  <text class="ts ts-blue" x="290" y="422" text-anchor="middle" dominant-baseline="central">Bedrock</text>

  <!-- Writer → Critic -->
  <line x1="350" y1="410" x2="362" y2="410" class="arr"/>

  <!-- Critic -->
  <rect x="364" y="388" width="120" height="44" rx="8" class="box-blue"/>
  <text class="th th-blue" x="424" y="406" text-anchor="middle" dominant-baseline="central">Critic</text>
  <text class="ts ts-blue" x="424" y="422" text-anchor="middle" dominant-baseline="central">Bedrock</text>

  <!-- Critic → Save Result -->
  <line x1="484" y1="410" x2="496" y2="410" class="arr"/>

  <!-- Save Result -->
  <rect x="498" y="388" width="122" height="44" rx="8" class="box-amber"/>
  <text class="th th-amber" x="559" y="406" text-anchor="middle" dominant-baseline="central">Save result</text>
  <text class="ts ts-amber" x="559" y="422" text-anchor="middle" dominant-baseline="central">→ DynamoDB</text>

  <!-- Step Functions → DynamoDB (cache check hit path, exits bottom of container) -->
  <line x1="130" y1="340" x2="130" y2="510" class="arr"/>

  <!-- Save Result → DynamoDB (exits bottom of container) -->
  <line x1="559" y1="432" x2="559" y2="510" class="arr"/>

  <!-- DynamoDB — fully outside Step Functions container -->
  <rect x="60" y="512" width="560" height="44" rx="8" class="box-amber"/>
  <text class="th th-amber" x="340" y="530" text-anchor="middle" dominant-baseline="central">Amazon DynamoDB</text>
  <text class="ts ts-amber" x="340" y="546" text-anchor="middle" dominant-baseline="central">research_runs table · 24hr TTL cache</text>

  <!-- DynamoDB → Pipeline Status Lambda -->
  <line x1="340" y1="556" x2="340" y2="584" class="arr"/>

  <!-- Pipeline Status Lambda -->
  <rect x="200" y="586" width="280" height="44" rx="8" class="box-purple"/>
  <text class="th th-purple" x="340" y="604" text-anchor="middle" dominant-baseline="central">Pipeline status Lambda</text>
  <text class="ts ts-purple" x="340" y="620" text-anchor="middle" dominant-baseline="central">browser polls GET /status every 2s</text>

  <!-- Return arrow: Status Lambda → Browser (dashed, right side) -->
  <path d="M480 608 L624 608 L624 42 L422 42" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts" x="636" y="325" text-anchor="middle" dominant-baseline="central" transform="rotate(90 636 325)">result when SUCCEEDED</text>

</svg>
